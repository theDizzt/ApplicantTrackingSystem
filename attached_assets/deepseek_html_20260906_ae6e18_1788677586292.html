<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 자기소개서 생성기 (음성 녹음 + 파일 업로드)</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .api-key-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .api-key-section label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .api-key-section input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .recording-section, .upload-section {
            text-align: center;
            margin-bottom: 25px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        #startBtn {
            background: #27ae60;
            color: white;
        }
        #startBtn:hover:not(:disabled) {
            background: #219a52;
        }
        #stopBtn {
            background: #e74c3c;
            color: white;
        }
        #stopBtn:hover:not(:disabled) {
            background: #c0392b;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .upload-section {
            border-top: 1px dashed #ccc;
            padding-top: 20px;
        }
        .upload-section h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .custom-file-upload {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .custom-file-upload:hover {
            background: #2980b9;
        }
        #fileInput {
            display: none;
        }
        .file-info {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }
        .status {
            color: #555;
            margin: 10px 0;
            font-style: italic;
        }
        .timer {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
        }
        textarea, .result-box {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            box-sizing: border-box;
            resize: vertical;
            min-height: 150px;
            background: #fafafa;
        }
        .result-box {
            white-space: pre-wrap;
            background: #f0f8ff;
            border-color: #b0d4f1;
            min-height: 300px;
            overflow-y: auto;
        }
        .section-title {
            font-weight: bold;
            color: #2c3e50;
            margin-top: 25px;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #e74c3c;
            background: #fdecea;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .note {
            font-size: 12px;
            color: #95a5a6;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ AI 자기소개서 생성기</h1>
        <p class="subtitle">음성 녹음 또는 파일 업로드로 이야기를 전달하면 AI가 이력서에 쓸 자기소개서를 작성합니다.</p>

        <div class="api-key-section">
            <label for="apiKey">OpenAI API 키</label>
            <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
            <small style="color:#888;">API 키는 브라우저에만 저장되며 서버로 전송되지 않습니다.</small>
        </div>

        <!-- 음성 녹음 섹션 -->
        <div class="recording-section">
            <div class="buttons">
                <button id="startBtn">🎤 녹음 시작</button>
                <button id="stopBtn" disabled>⏹️ 녹음 종료</button>
            </div>
            <div class="timer" id="timerDisplay">00:00</div>
            <div class="status" id="status">녹음 버튼을 눌러 시작하거나, 아래에서 오디오 파일을 업로드하세요. (5~10분 권장)</div>
        </div>

        <!-- 파일 업로드 섹션 -->
        <div class="upload-section">
            <h3>📁 또는 오디오 파일 업로드</h3>
            <label for="fileInput" class="custom-file-upload">파일 선택 (mp3, wav, m4a, ogg 등)</label>
            <input type="file" id="fileInput" accept="audio/*">
            <div class="file-info" id="fileInfo">선택된 파일 없음</div>
            <div style="margin-top:10px;">
                <button id="uploadBtn" disabled>📤 업로드하여 변환 시작</button>
            </div>
        </div>

        <div class="section-title">📝 변환된 원문 텍스트</div>
        <textarea id="rawText" placeholder="음성 인식 결과가 여기에 표시됩니다..." readonly></textarea>

        <div class="section-title">✨ 정리된 자기소개서 (3단 구조)</div>
        <div class="result-box" id="resultBox">결과가 여기에 표시됩니다.</div>

        <div class="note">※ OpenAI Whisper와 GPT 모델을 사용합니다. 파일 크기는 25MB 이하로 제한됩니다.</div>
    </div>

    <script>
        // DOM 요소
        const apiKeyInput = document.getElementById('apiKey');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const statusDiv = document.getElementById('status');
        const rawTextArea = document.getElementById('rawText');
        const resultBox = document.getElementById('resultBox');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const uploadBtn = document.getElementById('uploadBtn');

        // 변수
        let mediaRecorder;
        let audioChunks = [];
        let recordingStartTime;
        let timerInterval;
        let selectedFile = null; // 업로드할 파일 저장

        // ==== 음성 녹음 관련 ====
        startBtn.addEventListener('click', async () => {
            if (!apiKeyInput.value.trim()) {
                alert('OpenAI API 키를 입력해주세요.');
                apiKeyInput.focus();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    // 녹음 파일 이름과 확장자 결정
                    const ext = mediaRecorder.mimeType.includes('mp4') ? 'mp4' :
                                mediaRecorder.mimeType.includes('ogg') ? 'ogg' : 'webm';
                    const filename = `recording.${ext}`;
                    // 파일 업로드 없이 바로 변환
                    transcribeAudio(audioBlob, filename, mediaRecorder.mimeType);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                recordingStartTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);

                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusDiv.textContent = '🔴 녹음 중... 말씀해주세요.';
                statusDiv.style.color = '#e74c3c';
                rawTextArea.value = '';
                resultBox.textContent = '';
            } catch (error) {
                console.error('마이크 접근 오류:', error);
                statusDiv.textContent = '마이크 접근이 거부되었거나 사용할 수 없습니다.';
                statusDiv.style.color = '#e74c3c';
            }
        });

        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                clearInterval(timerInterval);
                startBtn.disabled = false;
                stopBtn.disabled = true;
                statusDiv.textContent = '⏳ 음성을 텍스트로 변환 중...';
                statusDiv.style.color = '#3498db';
                timerDisplay.textContent = '00:00';
            }
        });

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${minutes}:${seconds}`;
        }

        // ==== 파일 업로드 관련 ====
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                fileInfo.textContent = `선택된 파일: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                uploadBtn.disabled = false;
            } else {
                selectedFile = null;
                fileInfo.textContent = '선택된 파일 없음';
                uploadBtn.disabled = true;
            }
        });

        uploadBtn.addEventListener('click', () => {
            if (!apiKeyInput.value.trim()) {
                alert('OpenAI API 키를 입력해주세요.');
                apiKeyInput.focus();
                return;
            }
            if (!selectedFile) {
                alert('파일을 먼저 선택해주세요.');
                return;
            }
            if (selectedFile.size > 25 * 1024 * 1024) {
                alert('파일 크기는 25MB를 초과할 수 없습니다.');
                return;
            }

            statusDiv.textContent = '⏳ 업로드한 파일을 텍스트로 변환 중...';
            statusDiv.style.color = '#3498db';
            rawTextArea.value = '';
            resultBox.textContent = '';

            // 파일 객체를 그대로 전달 (Blob 상속)
            transcribeAudio(selectedFile, selectedFile.name, selectedFile.type);
        });

        // ==== Whisper API로 음성→텍스트 변환 (공용 함수) ====
        async function transcribeAudio(blob, filename, mimeType) {
            const apiKey = apiKeyInput.value.trim();
            const formData = new FormData();
            // 파일 이름과 MIME 타입을 지정하여 FormData에 추가
            formData.append('file', blob, filename);
            formData.append('model', 'whisper-1');
            formData.append('language', 'ko'); // 한국어 지정

            try {
                const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                const transcribedText = data.text;
                rawTextArea.value = transcribedText;
                statusDiv.textContent = '✅ 텍스트 추출 완료. GPT로 정리 중...';
                statusDiv.style.color = '#27ae60';

                // LLM 호출하여 구조화
                await structureWithGPT(transcribedText, apiKey);

            } catch (error) {
                console.error('Whisper 오류:', error);
                statusDiv.textContent = `❌ 음성 인식 실패: ${error.message}`;
                statusDiv.style.color = '#e74c3c';
            }
        }

        // ==== GPT API로 자기소개서 구조화 ====
        async function structureWithGPT(rawText, apiKey) {
            const prompt = `당신은 전문 자기소개서 작성 전문가입니다. 
아래는 구직자가 자신의 성장배경, 경력, 강점, 입사 후 포부 등에 대해 음성으로 말한 것을 텍스트로 변환한 원문입니다.

[원문]
${rawText}

위 원문을 분석하여 자기소개서를 작성해주세요. 아래 조건을 반드시 지켜주세요.

1. 섹션 구성: "성장배경", "경력 및 경험", "입사 후 포부" 세 부분으로 나눕니다.
2. 각 섹션은 반드시 **3문단 구조**로 작성합니다. (도입-본론-결론 또는 상황-행동-결과 등 자연스러운 3단 구성)
3. 한국어로 작성하며, 이력서에 바로 사용할 수 있는 전문적이고 간결한 문체를 사용합니다.
4. 원문의 내용을 충실히 반영하되, 문장을 다듬고 논리적으로 재구성합니다.
5. 각 섹션 제목은 "## 성장배경", "## 경력 및 경험", "## 입사 후 포부" 형식으로 표시합니다.
6. 전체 분량은 A4 1~2장 분량으로 작성해주세요.

이제 자기소개서를 작성해주세요.`;

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o', // 또는 gpt-3.5-turbo
                        messages: [
                            { role: 'system', content: '당신은 전문 커리어 컨설턴트이자 자기소개서 작성 전문가입니다.' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 2000
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                const structuredText = data.choices[0].message.content.trim();
                resultBox.textContent = structuredText;
                statusDiv.textContent = '🎉 자기소개서 생성 완료!';
                statusDiv.style.color = '#27ae60';

            } catch (error) {
                console.error('GPT 오류:', error);
                statusDiv.textContent = `❌ 문장 정리 실패: ${error.message}`;
                statusDiv.style.color = '#e74c3c';
            }
        }
    </script>
</body>
</html>
