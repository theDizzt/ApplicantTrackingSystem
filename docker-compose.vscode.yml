services:
  db:
    image: postgres:16
    container_name: ats-vscode-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atsdb}
      POSTGRES_USER: ${POSTGRES_USER:-ats_vscode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ats_vscode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  ats_vscode_pgdata:
