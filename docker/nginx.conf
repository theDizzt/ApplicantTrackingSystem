# =============================================================================
# Nginx 설정 — AI 서류 심사관 (ATS)
# 역할: SPA 정적 파일 서빙 + /api 역방향 프록시 (→ Node.js :8080)
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 성능 ──────────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    keepalive_requests 1000;
    server_tokens      off;

    # ── Gzip 압축 ─────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── 로그 ──────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── 업스트림: Node.js API ─────────────────────────────────────────────────
    upstream api_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    # 상위 프록시(TLS 종료 LB 등)가 보낸 X-Forwarded-Proto가 있으면 유지,
    # 없으면(직접 접속) 현재 연결의 스킴을 사용
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # ── 서버 블록 ─────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # 클라이언트 업로드 제한 (이력서 파일 등)
        client_max_body_size 50m;

        # ── /api/* → Node.js 프록시 ──────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection        "";

            # AI 분석 작업은 오래 걸릴 수 있음 (최대 10분)
            proxy_connect_timeout  60s;
            proxy_send_timeout     600s;
            proxy_read_timeout     600s;

            # 버퍼링 설정
            proxy_buffering          on;
            proxy_buffer_size        8k;
            proxy_buffers            8 64k;
            proxy_busy_buffers_size  128k;
        }

        # ── 정적 자산: 장기 캐시 ─────────────────────────────────────────────
        location ~* \.(js|css|woff2|woff|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
            try_files   $uri =404;
        }

        # ── SPA 폴백: 모든 미지정 경로 → index.html ──────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── 헬스체크 ─────────────────────────────────────────────────────────
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
