kind = "slides"
previewPath = "/ats-pitch/"
title = "AI 서류 심사관 제품 소개서"
version = "1.0.0"
id = "artifacts/ats-pitch"
router = "path"

[[services]]
name = "web"
paths = [ "/ats-pitch/" ]
localPort = 21203

[services.development]
run = "pnpm --filter @workspace/ats-pitch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ats-pitch", "run", "build" ]
serve = "static"
publicDir = "artifacts/ats-pitch/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21203"
BASE_PATH = "/ats-pitch/"
