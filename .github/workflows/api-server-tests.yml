name: API Server Tests

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: api-server-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: API Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply guided prompt monitor schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
        run: pnpm --filter @workspace/db run migrate:guided-prompt-monitor

      - name: Run API server tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
        run: pnpm --filter @workspace/api-server run test

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Smoke test built API server
        env:
          ADMIN_PASSWORD_HASH: ci-smoke-test-unused-hash
          ADMIN_USERNAME: ci-smoke-test-admin
          SESSION_SECRET: ci-smoke-test-session-secret
          SMOKE_TEST_PORT: "43123"
        run: pnpm --filter @workspace/api-server run smoke:start
